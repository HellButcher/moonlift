[package]
name = "moonlift"
version = "0.1.0-alpha.0"
description = "A pure-rust implementation of *Lua* (5.4) with *just-in-time* (JIT) compilation using `cranelift`"
authors = ["Christoph Hommelsheim <main@chommel.en>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/HellButcher/moonlift.git"
edition = "2021"
rust-version = "1.65"

[dependencies]
cranelift = "0.127"
cranelift-jit = "0.127"
cranelift-module = "0.127"
cranelift-native = "0.127"
thiserror = "2.0"
abfall = "0.1"

[dev-dependencies]
insta = { version = "1.45", default-features = false }
similar-asserts = "1.7"
